<!doctype html>
<html lang="ja">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>LINEログイン</title>


    <!-- ========================================
         LIFF SDK
         ======================================== -->

    <script
        src="https://static.line-scdn.net/liff/edge/2/sdk.js">
    </script>

</head>


<body>

    <div id="profile">
        LINEログイン処理中...
    </div>


    <script type="module">

        // ========================================
        // Firebase
        // ========================================

        import {
            auth,
            db
        } from "./js/firebase.js";


        // ========================================
        // Firebase Authentication
        // ========================================

        import {
            signInWithCustomToken
        }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        // ========================================
        // Firestore
        // ========================================

        import {
            doc,
            setDoc
        }
        from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        // ========================================
        // LIFF ID
        // ========================================

        const LIFF_ID =
            "2010798410-JCfc0ZnA";


        // ========================================
        // 表示エリア
        // ========================================

        const profileElement =
            document.getElementById("profile");


        // ========================================
        // メイン処理
        // ========================================

        (async () => {

            try {

                // ====================================
                // LIFF初期化
                // ====================================

                profileElement.textContent =
                    "LINEを確認しています...";


                await liff.init({
                    liffId: LIFF_ID
                });


                console.log(
                    "LIFF初期化完了"
                );


                // ====================================
                // LINEログイン確認
                // ====================================

                if (!liff.isLoggedIn()) {

                    profileElement.textContent =
                        "LINEログイン画面を開いています...";


                    liff.login();

                    return;
                }


                // ====================================
                // LINE IDトークン取得
                // ====================================

                profileElement.textContent =
                    "LINE情報を確認しています...";


                const idToken =
                    liff.getIDToken();


                if (!idToken) {

                    throw new Error(
                        "LINE IDトークンを取得できませんでした。\n" +
                        "LIFF設定のopenidスコープを確認してください。"
                    );
                }


                console.log(
                    "LINE IDトークン取得完了"
                );


                // ====================================
                // Cloud Functionsへ送信
                // ====================================

                profileElement.textContent =
                    "Firebaseへログインしています...";


                const response =
                    await fetch(
                        "/api/line-login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    idToken:
                                        idToken
                                })
                        }
                    );


                // ====================================
                // サーバーエラー
                // ====================================

                if (!response.ok) {

                    const errorText =
                        await response.text();


                    throw new Error(
                        "LINEログインに失敗しました。\n\n" +
                        errorText
                    );
                }


                // ====================================
                // サーバー結果取得
                // ====================================

                const result =
                    await response.json();


                console.log(
                    "サーバーからの結果:",
                    result
                );


                if (
                    !result.success ||
                    !result.customToken
                ) {

                    throw new Error(
                        "Firebase Custom Tokenを取得できませんでした。"
                    );
                }


                // ====================================
                // Firebase Authenticationログイン
                // ====================================

                const userCredential =
                    await signInWithCustomToken(
                        auth,
                        result.customToken
                    );


                const user =
                    userCredential.user;


                console.log(
                    "Firebaseログイン成功:",
                    user.uid
                );


                // ====================================
                // Firestoreへユーザー情報保存
                // ====================================

                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        lineUserId:
                            result.lineUserId || "",

                        displayName:
                            result.displayName || "",

                        pictureUrl:
                            result.pictureUrl || "",

                        email:
                            result.email || "",

                        updatedAt:
                            new Date().toISOString()

                    },
                    {
                        merge: true
                    }
                );


                console.log(
                    "Firestore保存完了"
                );

                profileElement.textContent ="Firestore保存完了";


                // ====================================
                // ログイン完了
                // ====================================

                profileElement.textContent =
                    "ログインしました。";


                // ====================================
                // index.htmlへ移動
                // ====================================

                setTimeout(
                    () => {

                        location.replace(
                            "index.html"
                        );

                    },
                    300
                );


            } catch (error) {

                // ====================================
                // エラー処理
                // ====================================

                console.error(
                    "LINE → Firebaseログインエラー:",
                    error
                );


                profileElement.textContent =
                    "ログインに失敗しました。";


                alert(
                    "ログインできませんでした。\n\n" +
                    error.message
                );

            }

        })();

    </script>

</body>

</html>
